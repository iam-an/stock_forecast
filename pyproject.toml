[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "project-venv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.30.1",
    "jpholiday>=1.0.3",
    "matplotlib>=3.10.6",
    "mlflow>=3.6.0",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "plotly>=6.5.0",
    "polars>=1.33.1",
    "prophet>=1.1.7",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "statsmodels>=0.14.5",
    "streamlit>=1.52.2",
    "yfinance>=0.2.66",
]


[tool.setuptools]
packages = ["product", "each_workspace"]
